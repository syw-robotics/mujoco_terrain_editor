<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI kit</title>
  <link rel="stylesheet" href="ui.css">
  <script>document.documentElement.setAttribute("data-theme", /^(dark|ink)$/.test(localStorage.getItem("ui-theme")||"") ? "dark" : "light");</script>
  <style>
    body { padding: var(--ui-space-4); }
    main { max-width: 720px; margin: auto; display: grid; gap: var(--ui-space-3); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--ui-space-2); }
    .ui-panel { padding: var(--ui-space-3); }
    .row { display: flex; flex-wrap: wrap; gap: var(--ui-space-1); }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <div>
        <p class="ui-kicker">UI KIT</p>
        <h1 style="margin: 8px 0 0; font-size: 28px;">文档工具界面</h1>
      </div>
      <button id="theme" class="ui-theme-toggle" type="button" aria-label="切换为深色模式">
        <svg class="ui-icon" data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="ui-icon" data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
    <section class="ui-panel">
      <p class="ui-hint">这是独立于业务逻辑的样式示例。换主题只改颜色，不改组件结构。</p>
      <p class="row">
        <button class="ui-button" type="button">主要操作</button>
        <button class="ui-button ui-button--secondary" type="button">次要操作</button>
        <button class="ui-button ui-button--ghost" type="button">文字操作</button>
      </p>
      <p class="ui-kicker" style="margin-top: var(--ui-space-2);">分段切换</p>
      <div class="ui-segment" style="max-width: 240px;">
        <button class="ui-segment__btn ui-segment__btn--active" type="button">选项 A</button>
        <button class="ui-segment__btn" type="button">选项 B</button>
      </div>
      <p class="ui-kicker" style="margin-top: var(--ui-space-2);">选项芯片</p>
      <div class="ui-chip-group">
        <button class="ui-chip ui-chip--active" type="button">自由</button>
        <button class="ui-chip" type="button">1:1</button>
        <button class="ui-chip" type="button">4:3</button>
        <button class="ui-chip" type="button">16:9</button>
      </div>
      <label class="ui-hint" for="sample">正文</label>
      <textarea id="sample" class="ui-textarea" rows="5" placeholder="# Document title"></textarea>
    </section>
    <section class="ui-panel ui-prose">
      <h1>预览排版</h1>
      <p>正文使用系统无衬线字体；元信息使用等宽字体。</p>
      <blockquote>控件小圆角，主按钮实底，避免渐变和大阴影。</blockquote>
    </section>
  </main>
  <script>
    const root = document.documentElement;
    const btn = document.getElementById("theme");
    const dark = () => root.getAttribute("data-theme") === "dark";
    function sync() { btn.setAttribute("aria-label", dark() ? "切换为浅色模式" : "切换为深色模式"); }
    sync();
    btn.addEventListener("click", () => {
      root.setAttribute("data-theme", dark() ? "light" : "dark");
      localStorage.setItem("ui-theme", root.getAttribute("data-theme"));
      sync();
    });
  </script>
</body>
</html>
